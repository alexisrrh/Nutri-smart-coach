<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06110e" />
    <title>NutriSmart Coach</title>
    <style>
      :root {
        color-scheme: dark;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        background: #06110e;
        color: #f5f7f6;
        font-family: Inter, system-ui, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
      }

      .panel {
        width: min(100%, 360px);
        border: 1px solid rgba(16, 185, 129, 0.18);
        border-radius: 24px;
        background: linear-gradient(180deg, rgba(6, 17, 14, 0.96), rgba(4, 10, 8, 0.96));
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        padding: 24px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 999px;
        border: 1px solid rgba(16, 185, 129, 0.18);
        background: rgba(16, 185, 129, 0.08);
        color: #a7f3d0;
        font-size: 12px;
        font-weight: 700;
        padding: 8px 12px;
      }

      h1 {
        margin: 18px 0 8px;
        font-size: 28px;
        line-height: 1.05;
      }

      p {
        margin: 0;
        color: rgba(255, 255, 255, 0.7);
        line-height: 1.5;
        font-size: 14px;
      }

      .button {
        margin-top: 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        border-radius: 16px;
        border: 0;
        background: #10b981;
        color: #03110d;
        font-weight: 800;
        font-size: 14px;
        padding: 14px 16px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <div class="badge">NutriSmart Coach offline</div>
      <h1>Sin conexión</h1>
      <p>
        La interfaz principal está disponible cuando recuperes la conexión. Si ya habías abierto la app antes, algunas pantallas seguirán cargando desde caché.
      </p>
      <a class="button" href="/">Reintentar</a>
    </main>
  </body>
</html>
